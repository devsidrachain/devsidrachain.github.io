
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevSidraChain</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      color: #38bdf8;
      font-size: 34px;
    }

    p {
      color: #cbd5e1;
      margin-bottom: 30px;
    }

    .ecosystem-button {
      display: inline-block;
      padding: 16px 28px;
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      box-shadow: 0 5px 20px #0005;
      transition: transform 0.2s, opacity 0.2s;
    }

    .ecosystem-button:hover {
      transform: translateY(-3px);
      opacity: 0.9;
    }

    footer {
      margin-top: 45px;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <h1>Welcome to DevSidraChain</h1>

  <p>Building the future of Web3.</p>

  <a
    class="ecosystem-button"
    href="http://169.58.127.36:8080"
    target="_blank"
    rel="noopener noreferrer">
    Ecosystem SidraChain ↗
  </a>

  <footer>
    DevSidraChain · Web3 Ecosystem
  </footer>
</body>
</html>
